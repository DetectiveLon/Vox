name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps voxlock==1.3.0

      - name: Fetch model files
        run: python tools/fetch_models.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Self-test from source (CPU)
        run: python -m voxapp --selftest --mode cpu --result "$env:TEMP\vox-source.json"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build.ps1 -SkipTests

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vox-windows-x64
          if-no-files-found: error
          path: |
            installer/Output/Vox-*-setup.exe
            installer/Output/Vox-*-portable.zip
            installer/Output/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem installer\Output -File |
            Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } |
            ForEach-Object { $_.FullName }
          gh release create $tag @files --title "Vox $tag" --generate-notes
